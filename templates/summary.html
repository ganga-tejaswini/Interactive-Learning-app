{% extends "base.html" %}
{% block title %}Summarizer | Interactive AI Learning App{% endblock %}
{% block content %}
<section class="container section-pad">
  <div class="section-title">
    <p class="eyebrow">Notes summarizer</p>
    <h1>Summarize Study Notes</h1>
  </div>
  <div class="row g-4">
    <div class="col-lg-6">
      <article class="app-card">
        <label>Subject<select class="form-select" id="summarySubject">{% for subject in subjects %}<option>{{ subject }}</option>{% endfor %}</select></label>
        <label class="mt-3">Title<input class="form-control" id="summaryTitle" value="Class notes"></label>
        <label class="mt-3">Notes<textarea class="form-control" id="notesInput" rows="14" placeholder="Paste notes or study material here."></textarea></label>
        <button class="btn btn-primary w-100 mt-3" id="summarizeBtn">Summarize</button>
      </article>
    </div>
    <div class="col-lg-6">
      <article class="app-card summary-output">
        <h2>AI Summary</h2>
        <p id="summaryText">Your concise summary will appear here.</p>
        <h3>Important Points</h3>
        <ul id="keyPoints"></ul>
      </article>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/summary.js') }}?v=2"></script>{% endblock %}
