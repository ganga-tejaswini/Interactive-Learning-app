{% extends "base.html" %}
{% block title %}Login | Interactive AI Learning App{% endblock %}
{% block content %}
<section class="auth-wrap container">
  <form class="auth-card" method="post">
    <p class="eyebrow">Welcome back</p>
    <h1>Login</h1>
    <label>Email<input class="form-control" type="email" name="email" required></label>
    <label>Password<input class="form-control" type="password" name="password" required></label>
    <button class="btn btn-primary w-100" type="submit">Login</button>
    <p class="mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</section>
{% endblock %}
